spring:
  application:
    name: keila-calcados-api

  # ─── Banco de dados ───────────────────────────────────────────────
  # H2 em arquivo local — sem dependência externa (Postgres/Docker).
  # O arquivo fica em backend/data/keiladb.mv.db, criado na primeira execução.
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/keiladb;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: ${DB_USER:sa}
    password: ${DB_PASS:}

  jpa:
    hibernate:
      ddl-auto: update               # Hibernate cria/atualiza o schema a partir das entidades
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false              # Evita N+1 silencioso; lazy loading explícito

  h2:
    console:
      enabled: true
      path: /h2-console

  # ─── Upload de arquivos ───────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ─── Configurações da aplicação ────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:keila-super-secret-jwt-key-2025-change-in-production}
    expiration-ms: 86400000          # 24 horas
    pin-expiration-ms: 28800000      # 8 horas (sessão de turno no caixa)

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin123}
    bucket-produtos: ${MINIO_BUCKET:keila-produtos}
    bucket-documentos: keila-documentos

  pdv:
    # Percentual máximo de desconto sem autorização de gerente
    desconto-maximo-sem-autorizacao: 10
    # Dias de validade padrão para orçamentos
    orcamento-validade-dias: 7

# ─── Actuator: health check e métricas ────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ─── OpenAPI / Swagger ────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui
    operations-sorter: alpha

# ─── Logging ──────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    br.com.keila: DEBUG
    org.hibernate.SQL: WARN             # Ativar DEBUG para ver queries
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
