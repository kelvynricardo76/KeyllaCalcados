services:
  postgres:
    image: postgres:16-alpine
    container_name: keila-postgres
    environment:
      POSTGRES_DB: keila_calcados
      POSTGRES_USER: keila
      POSTGRES_PASSWORD: keila123
    ports:
      - "5432:5432"
    volumes:
      - keila_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keila -d keila_calcados"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: keila-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: keila-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - keila_minio_data:/data

volumes:
  keila_postgres_data:
  keila_minio_data:
